
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="index.css">
  <title>오늘도 환생 2 도구</title>
</head>
<body>

<header>
  <h1>✦ 오늘도 환생 2 도구</h1>
</header>

<main>
  <div class="toolbar">
  </div>

  <div id="count" class="count"></div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" hidden>
    검색 결과가 없습니다.
  </div>
</main>

<script>
  // 새 HTML 파일을 추가할 때 이 배열만 수정
    const pages = [
        {
            title: "발굴 탐색기",
            description: "화석이 존재할 만한 위치를 확률로 예측합니다.",
            icon: "⛏️",
            url: "./pages/hidden_item_finder.html",
            state: true,
            version: "v1.0.0"
        },
        {
            title: "유물 공방 배치 추천기 v1",
            description: "정형화된 알고리즘으로 일정한 규칙의 배치를 추천합니다. 단, 실제 게임과는 일부 다른 알고리즘이므로 합성 과정에서 근소한 차이가 있을 수 있습니다.",
            icon: "🏛️",
            url: "./pages/hex_merge_advisor_v1.html",
            state: true,
            version: "v1.0.0"
        },
        {
            title: "유물 공방 배치 추천기 v2",
            description: "일부 자명한 합성 배치를 제외하고 모든 합성 위치를 랜덤하게 결정합니다. 랜덤한 결과이므로 결과의 오차가 일정하지 않을 수 있습니다.",
            icon: "🏛️",
            url: "./pages/hex_merge_advisor_v2.html",
            state: true,
            version: "v1.0.0"
        },
    ];

    const grid = document.getElementById("grid");
    const count = document.getElementById("count");
    const empty = document.getElementById("empty");


    function render() {
        grid.replaceChildren();
        count.textContent = `${pages.length}개의 도구`;
        empty.hidden = pages.length !== 0;

        pages.forEach(page => {
            const card = document.createElement("a");
            card.className = "card";
            card.href = page.url;

            const icon = document.createElement("div");
            icon.className = "card-icon";
            icon.textContent = page.icon;

            const title = document.createElement("h3");
            title.textContent = page.title;

            const description = document.createElement("p");
            description.textContent = page.description;

            const state = document.createElement("span");
            state.className = "card-state";
            state.textContent = page.state ? page.version : "beta";

            card.append(icon, title, description, state);
            grid.appendChild(card);
        });
    }

  render();
</script>

</body>
</html>
