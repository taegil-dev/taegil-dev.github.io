<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="utf-8"/>
        <meta content="width=device-width,initial-scale=1" name="viewport"/>
        <link href="hidden_item_finder.css" rel="stylesheet"/>
        <title>
            발굴 탐색기
        </title>
    </head>
    <body oncontextmenu="return false">
        <div class="wrap">
            <h1>
                발굴 탐색기
            </h1>
            <div class="panel toolbar" style="flex-direction:column;gap:16px">
                <div>
                    <label>
                        크기
                        <input id="rows" max="16" min="2" type="number" value="8"/>
                        행 × 열
                        <input id="cols" max="16" min="2" type="number" value="8"/>
                    </label>
                    <label>
                        화석 개수
                        <input id="items" max="64" min="1" type="number" value="5"/>
                    </label>
                </div>
                <div style="display:flex;">
                    <button id="resize">
                        새 보드
                    </button>
                    <button id="undo">
                        되돌리기
                    </button>
                    <button id="reset">
                        초기화
                    </button>
                    <label>
                        <input checked="" id="prob" type="checkbox"/>
                        확률 표시
                    </label>
                    <div style="flex-grow:1"></div>
                    <label>
                        최대 표본 시도 기준
                        <select id="samples">
                            <option value="10000">
                                10,000
                            </option>
                            <option selected="" value="30000">
                                30,000
                            </option>
                            <option value="100000">
                                100,000
                            </option>
                        </select>
                    </label>
                </div>
            </div>
            <div class="panel">
                <div class="stats">
                    <span>
                        발견한 칸
                        <b id="hits">
                            0
                        </b>
                        / <b id="target">3</b>
                    </span>
                    <span>
                        빈칸
                        <b id="misses">
                            0
                        </b>
                    </span>
                    <span>
                        추천
                        <b id="best">
                            -
                        </b>
                    </span>
                    <span>
                        추정 확률
                        <b id="chance">
                            -
                        </b>
                    </span>
                </div>
                <div class="board" id="board">
                </div>
                <div class="legend muted">
                    <span>
                        초록색: 가로 발견 · 청록색: 세로 발견 · 보라색: 2×2 발견 · ×: 빈칸
                    </span>
                    <span>
                        노란 테두리: 추천
                    </span>
                </div>
                <p class="muted" id="status">
                </p>
            </div>
            <p class="muted">
                가능한 조합이 적으면 정확 계산, 많으면 조건부 표본 계산을 사용합니다. 조건부 표본 계산은 편향될 수 있으며 표본이 부족하면 결과가 불안정할 수 있습니다. 가능한 최종 배치가 동일 확률이라는 가정입니다.
            </p>
        </div>
         <div class="panel toolbar rightbar">
            <label>발견할 화석 모양
                <select id="mode">
                    <option value="1">가로 4칸 (1×4)</option>
                    <option value="2">세로 4칸 (4×1)</option>
                    <option value="3">정사각형 (2×2)</option>
                </select>
            </label>
            <span class="muted">클릭: 선택한 모양으로 발견 → 없음 → 초기화 (우클릭 시 바로 초기화)</span>
        </div>
        <script>
            let rows=8,cols=8,itemCount=3,state=[],history=[],generation=0;
            // 0=unknown, 1..12=(shape-1)*4+part, 13=empty
            const $=id=>document.getElementById(id);
            let worker=null;
            function init(){
                rows=Math.max(2,Math.min(16,Math.floor(Number($('rows').value)||8)));
                cols=Math.max(2,Math.min(16,Math.floor(Number($('cols').value)||8)));
                itemCount=Math.max(1,Math.min(Math.floor(rows*cols/4),Math.floor(Number($('items').value)||3)));
                $('rows').value=rows;
                $('cols').value=cols;
                $('items').max=Math.floor(rows*cols/4);
                $('items').value=itemCount;
                $('target').textContent=itemCount;
                state=Array(rows*cols).fill(0);
                history=[];
                render();
                compute()
            }
            function fixedInfo(){
                const shapes=[[[0,0],[0,1],[0,2],[0,3]],[[0,0],[1,0],[2,0],[3,0]],[[0,0],[0,1],[1,0],[1,1]]];
                const fixed=new Set(), owners=new Map(), errors=[];
                for(let i=0;i<state.length;i++){
                    const v=state[i];
                    if(v<1||v>12)continue;
                    const shape=Math.floor((v-1)/4),part=(v-1)%4;
                    const r=Math.floor(i/cols)-shapes[shape][part][0],c=i%cols-shapes[shape][part][1];
                    const key=`${shape}:${r}:${c}`;
                    if(r<0||c<0||shapes[shape].some(([dr,dc])=>r+dr>=rows||c+dc>=cols)){
                        errors.push(`${Math.floor(i/cols)+1}행 ${i%cols+1}열: 아이템이 보드 밖으로 나갑니다.`);continue;
                    }
                    const ids=shapes[shape].map(([dr,dc])=>(r+dr)*cols+c+dc);
                    owners.set(key,ids);
                    if(state.some((sv,j)=>sv>=1&&sv<=12&&ids.includes(j)&&sv!==(shape*4+ids.indexOf(j)+1)))errors.push('서로 충돌하는 파츠 정보가 있습니다.');
                    if(ids.some(j=>state[j]===13))errors.push('확정된 아이템 위치에 빈칸이 있습니다.');
                }
                for(const ids of owners.values())for(const id of ids){fixed.add(id)}
                const arr=[...owners.values()];
                for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)if(arr[i].some(id=>arr[j].includes(id)))errors.push('확정된 아이템들이 서로 겹칩니다.');
                if(arr.length>itemCount)errors.push('확정된 아이템 수가 설정한 아이템 개수보다 많습니다.');
                return {fixed,owners:arr,errors:[...new Set(errors)]};
            }
            function render(probs=[],best=-1){
                const info=fixedInfo(),board=$('board');
                board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
                board.innerHTML='';
                let hit=0,miss=0;
                state.forEach((v,i)=>{
                    if(v>=1&&v<=12)hit++;
                    if(v===13)miss++;
                    const b=document.createElement('button');
                    const known=info.fixed.has(i);
                    b.className='cell '+(v>=1&&v<=12?'hit':v===13?'miss':'')+(i===best&&v===0&&!known?' best':'');
                    if(known&&v===0){b.style.background='#2563b0';b.title='아이템 발견 완료 — 추가 클릭 불필요';}
                    b.title=`${Math.floor(i/cols)+1}행 ${i%cols+1}열`;
                    b.textContent=v>=1&&v<=12?`${['가','세','정'][Math.floor((v-1)/4)]}${(v-1)%4+1}`:v===13?'×':known?String(info.owners.find(ids=>ids.includes(i))?.indexOf(i)+1||'✓'):'';
                    if(v===0&&!known&&$('prob').checked&&probs[i]!=null)b.textContent=`${(probs[i]*100).toFixed(1)}%`;
                    b.onclick=()=>{
                        if(known&&v===0)return;
                        history.push([...state]);
                        const mode=Number($('mode').value),part=1;
                        state[i]=v===0?(mode-1)*4+part:v===13?0:13;
                        render();compute();
                    };
                    b.oncontextmenu=e=>{e.preventDefault();history.push([...state]);state[i]=0;render();compute()};
                    board.appendChild(b);
                });
                $('hits').textContent=info.owners.length;$('misses').textContent=miss;
                $('best').textContent=best<0?'-':`${Math.floor(best/cols)+1}행 ${best%cols+1}열`;
                $('chance').textContent=best<0||probs[best]==null?'-':`${(probs[best]*100).toFixed(1)}%`;
            }
            // Web Worker prevents UI blocking.
            const workerCode=`
            onmessage = (e) => {
                const {rows, cols, itemCount, state, limit} = e.data;
                const N = rows * cols;
                const originalItemCount=itemCount;
                const shapes = [
                    [[0,0],[0,1],[0,2],[0,3]],
                    [[0,0],[1,0],[2,0],[3,0]],
                    [[0,0],[0,1],[1,0],[1,1]]
                ];
                const hits = [];
                const fixedPlacements=new Map();
                for(let i=0;i<N;i++)if(state[i]>=1&&state[i]<=12){
                    const shape=Math.floor((state[i]-1)/4),part=(state[i]-1)%4;
                    const rr=Math.floor(i/cols)-shapes[shape][part][0],cc=i%cols-shapes[shape][part][1];
                    if(rr<0||cc<0||shapes[shape].some(([dr,dc])=>rr+dr>=rows||cc+dc>=cols)){
                        postMessage({error:'보드 밖으로 나가는 파츠입니다.'});return;
                    }
                    fixedPlacements.set(shape+':'+rr+':'+cc,shapes[shape].map(([dr,dc])=>(rr+dr)*cols+cc+dc));
                }
                const fixedIds=new Set();
                for(const ids of fixedPlacements.values())for(const id of ids)fixedIds.add(id);
                if(fixedPlacements.size>itemCount){postMessage({error:'아이템 개수를 초과했습니다.'});return;}
                const remaining=itemCount-fixedPlacements.size;
                const bit = Array.from({length:N},(_,i)=>1n<<BigInt(i));
                const hitMask = hits.reduce((m,i)=>m|bit[i],0n);
                const placements=[];
                for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) {
                    for (const shape of shapes) {
                        if (shape.some(([dr,dc])=>r+dr>=rows||c+dc>=cols)) continue;
                        const ids=shape.map(([dr,dc])=>(r+dr)*cols+c+dc);
                        if (ids.some((id,k)=>state[id]===13 || fixedIds.has(id))) continue;
                        const mask=ids.reduce((m,id)=>m|bit[id],0n);
                        placements.push({ids,mask,hit:mask&hitMask});
                    }
                }
                const P=placements.length;
                const counts=new Float64Array(N);
                let total=0, attempts=0, exact=false, truncated=false;
                const hitCandidates=hits.map(id=>placements.map((p,i)=>p.ids.includes(id)?i:-1).filter(i=>i>=0));
                function record(mask) {
                    if ((mask&hitMask)!==hitMask) return;
                    total++;
                    for (let i=0;i<N;i++) if (state[i]===0 && (mask&bit[i])) counts[i]++;
                }
                const deadline=Date.now()+1400;
                const maxNodes=Math.max(15000,Math.min(450000,limit*5));
                let nodes=0;
                // Exact enumeration for small placement spaces, with a strict work budget.
                function exactVisit(start,depth,mask) {
                    if (++nodes>maxNodes || Date.now()>deadline) {truncated=true;return;}
                    if (depth===remaining) {record(mask);return;}
                    for(let i=start;i<=P-(remaining-depth);i++) {
                        if(truncated)return;
                        const m=placements[i].mask;
                        if(!(mask&m))exactVisit(i+1,depth+1,mask|m);
                    }
                }
                function choose(n,k) {
                    if(k>n)return Infinity;
                    let v=1;
                    for(let i=1;i<=k;i++) {v=v*(n-i+1)/i;if(v>150000)return v;}
                    return v;
                }
                if (hits.length<=remaining*4 && P>=remaining && hitCandidates.every(a=>a.length)) {
                    if(choose(P,remaining)<=150000) {
                        exactVisit(0,0,0n);
                        exact=!truncated;
                    }
                    if(!exact) {
                        total=0;counts.fill(0);
                        // Conditional randomized backtracking: cover observed parts first,
                        // then complete with disjoint shapes. Avoid rejection of rare hits.
                        function sample(mask,depth,covered) {
                            if(++nodes>maxNodes || Date.now()>deadline)return false;
                            if(depth===remaining) {
                                if(covered===hitMask) {record(mask);return true;}
                                return false;
                            }
                            let choices=null;
                            for(let h=0;h<hits.length;h++) {
                                if(covered&bit[hits[h]])continue;
                                const opts=hitCandidates[h].filter(i=>!(placements[i].mask&mask));
                                if(!opts.length)return false;
                                if(!choices || opts.length<choices.length)choices=opts;
                            }
                            if(choices===null) {
                                choices=[];
                                for(let i=0;i<P;i++)if(!(placements[i].mask&mask))choices.push(i);
                            }
                            // Randomized order; bound branching for responsiveness.
                            for(let t=0;t<Math.min(choices.length,Math.max(5,Math.floor(40/(depth+1))));t++) {
                                const j=t+Math.floor(Math.random()*(choices.length-t));
                                [choices[t],choices[j]]=[choices[j],choices[t]];
                                const p=placements[choices[t]];
                                if(sample(mask|p.mask,depth+1,covered|p.hit))return true;
                                if(nodes>maxNodes || Date.now()>deadline)return false;
                            }
                            return false;
                        }
                        nodes=0;
                        while(attempts<limit && nodes<maxNodes && Date.now()<deadline) {
                            attempts++;
                            sample(0n,0,0n);
                        }
                    }
                }
                const probs=Array.from(counts,(x,i)=>fixedIds.has(i)?1:(total?x/total:null));
                let best=-1;
                for(let i=0;i<N;i++)if(state[i]===0&&!fixedIds.has(i)&&probs[i]!==null&&(best<0||probs[i]>probs[best]))best=i;
                postMessage({probs,best,total,exact,P,attempts,truncated,remaining});
            };
            `;
            let watchdog=null;
            let workerUrl=null;

            function stopWorker(){
                if(watchdog!==null){
                    clearTimeout(watchdog);
                    watchdog=null;
                }
                if(worker){
                    worker.terminate();
                    worker=null;
                }
                if(workerUrl){
                    URL.revokeObjectURL(workerUrl);
                    workerUrl=null;
                }
            }

            function compute(){
                generation++;
                const currentGeneration=generation;
                stopWorker();
                const info=fixedInfo();
                if(info.errors.length){render();$('status').textContent='입력 오류: '+info.errors.join(' ');return;}
                if(info.owners.length===itemCount){
                    render();
                    $('status').textContent='모든 아이템을 발견했습니다! 추가 클릭이 필요하지 않습니다.';
                    return;
                }
                $('status').textContent='가능한 배치를 계산 중...';

                try{
                    workerUrl=URL.createObjectURL(new Blob([workerCode],{
                        type:'text/javascript'
                    }));
                    worker=new Worker(workerUrl);
                    worker.onmessage=(event)=>{
                        if(currentGeneration!==generation)return;
                        const {probs,best,total,exact,P,attempts,error,remaining}=event.data;
                        stopWorker();
                        render(probs,best);
                        if(error){$('status').textContent=error;return;}
                        $('status').textContent=total===0
                            ? exact ? '조건에 맞는 배치가 없습니다. 입력 상태를 확인하세요.' : '조건에 맞는 표본을 찾지 못했습니다. 표본 시도를 늘리거나 입력 상태를 확인하세요.'
                            : exact
                                ? `정확 계산: 유효한 잔여 ${remaining}개 아이템 조합 ${total.toLocaleString()}개 (단일 아이템 후보 ${P}개)`
                                : `근사 계산: 유효 표본 ${total.toLocaleString()}개, 시도 ${attempts.toLocaleString()}회. 조건부 탐색 근사값으로 편향될 수 있습니다.`;
                    };
                    worker.onerror=(event)=>{
                        if(currentGeneration!==generation)return;
                        $('status').textContent=`Worker 실행 오류: ${event.message||'알 수 없는 오류'}`;
                        stopWorker();
                    };
                    watchdog=setTimeout(()=>{
                        if(currentGeneration!==generation)return;
                        stopWorker();
                        $('status').textContent='계산 시간 초과. 보드 크기나 조건을 확인해 주세요.';
                    },8000);
                    worker.postMessage({
                        rows,
                        cols,
                        itemCount,
                        state:[...state],
                        limit:Number($('samples').value)||10000
                    });
                }catch(error){
                    stopWorker();
                    $('status').textContent=`Worker 생성 오류: ${error.message}`;
                }
            }
            $('resize').onclick=init;
            $('items').onchange=init;
            $('reset').onclick=()=>{
                history.push([...state]);
                state.fill(0);
                render();
                compute()
            };
            $('undo').onclick=()=>{
                if(history.length){
                    state=history.pop();
                    render();
                    compute()
                }
            };
            $('prob').onchange=()=>compute();
            $('samples').onchange=()=>compute();
            init();
        </script>
    </body>
</html>
